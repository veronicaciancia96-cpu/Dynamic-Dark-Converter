<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Convertitore Video</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }
        #drop-zone {
            border: 2px dashed #ccc;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            background-color: #f9f9f9;
        }
        #drop-zone.dragging {
            background-color: #e9e9e9;
        }
        .status {
            margin-top: 10px;
            font-weight: bold;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="drop-zone">
    <p>Trascina qui o clicca per selezionare un video</p>
    <input type="file" id="file-input" accept="video/*" style="display:none;">
</div>

<button id="convert-btn">Converti e scarica video</button>

<div class="status" id="vid-status"></div>

<script>
var vidFile = null;
var vURL = null;
var va = document.getElementById('preview');

// Gestore drag&drop
const dropZone=document.getElementById('drop-zone');
dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('dragging');
});
dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('dragging');
});
dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragging');
    const files=e.dataTransfer.files;
    if(files.length)loadFile(files[0]);
});

// Gestore upload
const fileInput=document.getElementById('file-input');
document.getElementById('drop-zone').addEventListener('click', () => {
    fileInput.click();
});
fileInput.addEventListener('change', e => {
    loadFile(e.target.files[0]);
});

function loadFile(f){
    if(!f) return;
    vidFile = f;
    vURL = null;
    va.src=URL.createObjectURL(vidFile);
}

// Funzione principale di conversione
async function convertVideo() {
    // Creazione elemento video offscreen
    var cvid=document.createElement('video');
    cvid.style.position='fixed';cvid.style.left='-9999px';cvid.style.top='-9999px';
    cvid.style.width='2px';cvid.style.height='2px';cvid.style.opacity='0';
    cvid.preload='auto';cvid.playsInline=true;cvid.muted=false;cvid.volume=1.0;cvid.playbackRate=1.0;
    
    if(vURL){cvid.src=vURL;}
    else if(vidFile){cvid.src=URL.createObjectURL(vidFile);}
    else {setSt('vid','Sorgente video non trovata.',true);return;}
    
    document.body.appendChild(cvid);
    
    // Aspetta che siano disponibili dimensioni e durata
    await new Promise(function(resolve){
        var done=false;
        function ok(){if(done)return;done=true;clearTimeout(to);resolve();}
        cvid.addEventListener('loadedmetadata',ok,{once:true});
        cvid.addEventListener('canplay',ok,{once:true});
        var to=setTimeout(ok,5000);
        try{cvid.load();}catch(e){}
    });
    
    // Creazione canvas per il processing
    var canvas=document.createElement('canvas');
    canvas.width=cvid.videoWidth;
    canvas.height=cvid.videoHeight;
    var ctx=canvas.getContext('2d');
    
    // Applica filtro dark mode
    ctx.filter = 'contrast(0.7) brightness(0.8)';
    ctx.drawImage(cvid, 0, 0, cvid.videoWidth, cvid.videoHeight);
    
    // Converti in blob
    var blob=new Blob([canvas.toDataURL('video/mp4')], {type:'video/mp4'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download='converted-video.mp4';
    document.body.appendChild(a);
    a.click();
    URL.revokeObjectURL(url);
    document.body.removeChild(a);
}

// Funzioni di supporto
function setSt(id,txt,force){
    const el=document.getElementById(id+'-status');
    if(el)el.textContent=txt;
    if(force && id==='vid')alert(txt);
}
function startRaf(){requestAnimationFrame(()=>{startRaf();});}

document.getElementById('convert-btn').addEventListener('click', async () => {
    try { await convertVideo(); }
    catch(e){setSt('vid','Errore durante il download: '+e.message,true);}
});
</script>

</body>
</html>
