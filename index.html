<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Video Editor</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            font-family: sans-serif;
        }
        video { display: none; }
        canvas {display: none;}
        #btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
        }
        .bar {
            width: 100%;
            height: 10px;
            background-color: lightgray;
        }
        .barfill {
            background-color: blue;
            height: 100%;
            width: 0%;
        }
    </style>
</head>
<body>

<video id="v" controls></video>
<canvas id="c"></canvas>

<script type="text/javascript">
// ── Crea un elemento <video> dedicato (offscreen) per la conversione.
//    Evita il problema "il preview si pausa" causato da captureStream sullo
//    stesso elemento che è già in riproduzione visibile (osservato su file://).
var cvid=document.createElement('video');
cvid.style.position='fixed';cvid.style.left='-9999px';cvid.style.top='-9999px';
cvid.style.width='2px';cvid.style.height='2px';cvid.style.opacity='0';
cvid.preload='auto';cvid.playsInline=true;cvid.muted=false;cvid.volume=1.0;cvid.playbackRate=1.0;
// Riusa la stessa sorgente del preview (blob: URL o file caricato)
if(vURL){cvid.src=vURL;}
else if(vidFile){cvid.src=URL.createObjectURL(vidFile);}
else {setSt('vid','Sorgente video non trovata.',true);btn.disabled=false;startRaf();return;}
document.body.appendChild(cvid);

// Aspetta che siano disponibili dimensioni e durata
await new Promise(function(resolve){
    var done=false;
    function ok(){if(done)return;done=true;clearTimeout(to);resolve();}
    cvid.addEventListener('loadedmetadata',ok,{once:true});
    cvid.addEventListener('canplay',ok,{once:true});
    var to=setTimeout(ok,5000); // safety
    try{cvid.load();}catch(e){}
});

// Pre-pinge il primo frame così il blob non parte vuoto
try{ex.filter=flt;ex.drawImage(cvid,0,0,w,h);ex.filter='none';}catch(e){}

// Riprendi l'audio context se è sospeso (alcuni browser lo creano in suspended)
if(audioCtx && audioCtx.state==='suspended'){
    try{await audioCtx.resume();}catch(e){console.warn('[DDC] audioCtx.resume failed:',e);}
}

// NESSUN playbackRate>1: rovinerebbe la sincronia audio
rec.start(250);startTs=Date.now();
try{await cvid.play();}catch(e){
    stopRec();disposeCvid();
    setSt('vid','Errore avvio video: '+e.message,true);btn.disabled=false;startRaf();return;
}

// Disegna ogni frame tramite rAF: affidabile, non si blocca come rVFC
function rafLoop(){
    if(recStopped)return;
    if(cvid.ended||(dur&&cvid.currentTime>=dur-0.05)){stopRec();return;}
    // Disegna solo se il video ha dati decodificati (readyState >= HAVE_CURRENT_DATA)
    if(cvid.readyState>=2){
        try{ex.filter=flt;ex.drawImage(cvid,0,0,w,h);ex.filter='none';}catch(e){}
        if(dur>0) setBar('vid',Math.round((cvid.currentTime/dur)*16));
    }
    frameIv=requestAnimationFrame(rafLoop);
}
frameIv=requestAnimationFrame(rafLoop);

// Cattura il video filtrato dal canvas
var canvasStream;
try{canvasStream=(ec.captureStream||ec.mozCaptureStream).call(ec,30);}
catch(e){
    try{document.body.removeChild(cvid);}catch(e2){}
    setSt('vid','Errore stream canvas.',true);btn.disabled=false;startRaf();return;
}

// Stream combinato: video filtrato + audio originale
var videoTracks=canvasStream.getVideoTracks();
var combined=new MediaStream([].concat(videoTracks,audioTracks));
console.log('[DDC] Combined:',videoTracks.length,'video +',audioTracks.length,'audio');

// Bitrate alto per non perdere qualità rispetto all'originale
var recOpts={mimeType:mime,videoBitsPerSecond:5000000};
if(audioTracks.length>0)recOpts.audioBitsPerSecond=192000;
var rec;try{rec=new MediaRecorder(combined,recOpts);}
catch(e){
    try{document.body.removeChild(cvid);}catch(e2){}
    setSt('vid','Errore MediaRecorder: '+e.message,true);btn.disabled=false;startRaf();return;
}
vidChunks=[];rec.ondataavailable=function(e){if(e.data&&e.data.size>0)vidChunks.push(e.data);};

var flt=F,startTs=null,frameIv=null,watchdog=null,etaIv=null;
var recStopped=false;

// ── Funzioni per gestire l'interfaccia utente
function setSt(id,msg,er){if(er){msg='Error: '+msg;}else{msg='Info: '+msg;}document.getElementById(''+id).innerHTML=msg;}
function startRaf(){window.requestAnimationFrame(function(){console.log('[DDC] rAF');});}
function stopRec(){rec.stop();rec.ondataavailable=null;disposeCvid();}
function disposeCvid(){try{cvid.pause();cvid.src='';}catch(e){}}
function setBar(id,perc){document.getElementById(''+id).style.width=perc+'%';}

// ── Funzioni per applicare i filtri
function applyFilter(ex, cvid, w, h) {
    if (flt && flt !== 'none') {
        ex.filter = flt;
        ex.drawImage(cvid, 0, 0, w, h);
        ex.filter = 'none';
    } else {
        ex.drawImage(cvid, 0, 0, w, h);
    }
}

// ── Funzioni per convertire il video
async function convertVideoFallback() {
    if (cvid.readyState < 2) return;
    applyFilter(ex, cvid, w, h); // Usa la funzione applyFilter qui
}
</script>

<script type="text/javascript">
var vidFile = null; vURL = null; var btn=document.getElementById('btn');
var canvas= document.getElementById('c'); var ec=canvas.getContext('2d');
var ex=ec; var dur=0;
var flt='none'; // default

// ── Configurazione e inizializzazione
window.onload=function(){
    if (!document.querySelector('#v')) {return;}
    vURL = window.location.href.split('?')[1] ? decodeURIComponent(window.location.search) : null;
    if (vURL && !vURL.startsWith('blob:')) {
        try{new URL(vURL);setSt('vid','File non supportato.',false);btn.disabled=false;startRaf();return;}
        catch(e){console.warn('[DDC] URL invalid',e);}
    }
};

// ── Funzioni per gestire l'interfaccia utente
function setSt(id,msg,er){if(er){msg='Error: '+msg;}else{msg='Info: '+msg;}document.getElementById(''+id).innerHTML=msg;}
function startRaf(){window.requestAnimationFrame(function(){console.log('[DDC] rAF');});}
function stopRec(){rec.stop();rec.ondataavailable=null;disposeCvid();}
function disposeCvid(){try{cvid.pause();cvid.src='';}catch(e){}}
function setBar(id,perc){document.getElementById(''+id).style.width=perc+'%';}

// ── Funzioni per convertire il video
async function convertVideoFallback() {
    if (cvid.readyState < 2) return;
    applyFilter(ex, cvid, w, h); // Usa la funzione applyFilter qui
}
</script>

</body>
</html>
