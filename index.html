<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Convertitore Video in Dark Mode</title>
  <style>
    body {
      background-color: #202124;
      color: #e8e8ea;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #f0f0f0;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    input, button {
      background-color: #3c4048;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #4d5260;
    }

    video, canvas {
      display: none;
    }
  </style>
</head>
<body>

<h1>Convertitore Video in Dark Mode</h1>

<div class="controls">
  <input type="file" id="videoInput" accept="video/*" />
  <button id="convertBtn">Converti e Scarica Video</button>
</div>

<video id="preview" controls style="display: none;"></video>
<canvas id="canvas"></canvas>

<script>
  // Funzionalità di conversione del video in dark mode
  (function () {
    const input = document.getElementById('videoInput');
    const btn = document.getElementById('convertBtn');
    const preview = document.getElementById('preview');
    const canvas = document.getElementById('canvas');

    let vidFile, vURL;
    let vidOrigExt;

    function setSt(id, msg, isError) {
      // Simulazione funzione setSt
    }

    function startRaf() {
      // Simulazione funzione startRaf
    }

    btn.addEventListener('click', async () => {
      if (input.files.length > 0) {
        vidFile = input.files[0];
        vURL = null;
        vidOrigExt = '';
        preview.src = URL.createObjectURL(vidFile);
      } else {
        setSt('vid','Nessun file selezionato.',true);
        btn.disabled=false; startRaf();
        return;
      }

      // --- FUNZIONALITÀ DI CONVERSIONE ---

      let src = null;

      if (vURL) {
        src = vURL;
      } else if (vidFile) {
        src = URL.createObjectURL(vidFile);
      } else {
        setSt('vid','Sorgente video non trovata.', true);
        btn.disabled=false; startRaf();
        return;
      }

      // Creazione elemento <video> dedicato (offscreen)
      const cvid = document.createElement('video');
      cvid.style.position='fixed';
      cvid.style.left='-9999px';
      cvid.style.top='-9999px';
      cvid.style.width='2px';
      cvid.style.height='2px';
      cvid.style.opacity='0';
      cvid.preload='auto';
      cvid.playsInline=true;
      cvid.muted=false;
      cvid.volume=1.0;
      cvid.playbackRate=1.0;

      // Reuse della stessa sorgente del preview
      if (vURL) {
        cvid.src = vURL;
      } else if (vidFile) {
        cvid.src = URL.createObjectURL(vidFile);
      } else {
        setSt('vid','Sorgente video non trovata.',true);btn.disabled=false;startRaf();return;
      }

      document.body.appendChild(cvid);

      // Aspetta che siano disponibili dimensioni e durata
      await new Promise((resolve) => {
        let done = false;
        function ok() {
          if (done) return;
          done = true;
          clearTimeout(to);
          resolve();
        }
        cvid.addEventListener('loadedmetadata',ok,{once:true});
        cvid.addEventListener('canplay',ok,{once:true});
        const to=setTimeout(ok,5000); // safety
        try {
          cvid.load();
        } catch(e) {}
      });

      // Conversione del video (simulazione)
      let stream = cvid.captureStream();

      // Creazione MediaRecorder con codec supportati
      var ext=(vidOrigExt||'').toLowerCase();
      var prefMp4=(ext==='mp4'||ext==='mov'||ext==='m4v');
      var types=prefMp4
        ? ['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=h264,aac','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']
        : ['video/webm;codecs=vp9,*','video/webm;codecs=vp8,*','video/webm','video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4'];
      var mime='';
      for(var ti=0;ti<types.length;ti++){
        try{
          if(MediaRecorder.isTypeSupported(types[ti])){
            mime=types[ti];
            break;
          }
        } catch(e){}
      }
      if(!mime){
        setSt('vid','Nessun formato supportato.',true);btn.disabled=false;startRaf();return;
      }

      // Creazione MediaRecorder con il codec corretto
      let recorder = new MediaRecorder(stream, { mimeType: mime });
      let chunks = [];

      recorder.ondataavailable = function(event) {
        if (event.data && event.data.size > 0) {
          chunks.push(event.data);
        }
      };

      recorder.onerror = function(e) {
        console.error("Errore nella registrazione:", e);
      };

      // Avvio della registrazione
      recorder.start();

      // Fine registrazione dopo un po'
      setTimeout(() => {
        recorder.stop();
        let blob = new Blob(chunks, { type: mime });
        let url = URL.createObjectURL(blob);

        // Creazione di un link per il download
        let a = document.createElement('a');
        a.href = url;
        a.download = 'video-darkmode.mp4';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 500);

    });
  })();
</script>

</body>
</html>
