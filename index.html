<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Convertitore Video</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: #f0f0f0;
    }

    video {
      display: none;
    }

    canvas {
      display: none;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    button {
      background-color: #444;
      color: #f0f0f0;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #666;
    }

    .error {
      color: #ff4d4d;
    }

    .success {
      color: #4caf50;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Convertitore Video Dark Mode</h1>
  <input type="file" id="videoInput" accept="video/*">
  <br><br>
  <button onclick="convertVideo()">Converti in dark mode</button>
  <br><br>
  <div id="status"></div>
</div>

<script>
// ── Crea un elemento <video> dedicato (offscreen) per la conversione.
//    Evita il problema "il preview si pausa" causato da captureStream sullo
//    stesso elemento che è già in riproduzione visibile (osservato su file://).
var cvid=document.createElement('video');
cvid.style.position='fixed';cvid.style.left='-9999px';cvid.style.top='-9999px';
cvid.style.width='2px';cvid.style.height='2px';cvid.style.opacity='0';
cvid.preload='auto';cvid.playsInline=true;cvid.muted=false;cvid.volume=1.0;cvid.playbackRate=1.0;
// Riusa la stessa sorgente del preview (blob: URL o file caricato)
if(vURL){cvid.src=vURL;}
else if(vidFile){cvid.src=URL.createObjectURL(vidFile);}
else {setSt('vid','Sorgente video non trovata.',true);btn.disabled=false;startRaf();return;}
document.body.appendChild(cvid);

// Aspetta che siano disponibili dimensioni e durata
await new Promise(function(resolve){
  var done=false;
  function ok(){if(done)return;done=true;clearTimeout(to);resolve();}
  cvid.addEventListener('loadedmetadata',ok,{once:true});
  cvid.addEventListener('canplay',ok,{once:true});
  var to=setTimeout(ok,5000); // safety
  try{cvid.load();}catch(e){}
});

// ─── DOCUMENTO ───
// Applica invert+hue-rotate con fallback pixel per Safari
function applyDocFilter(ctx, src, w, h){
  // Usa sempre il metodo pixel — garantito su tutti i browser incluso WebKit/Unite Pro
  // ctx.filter con hue-rotate è instabile su alcune versioni di WebKit
  ctx.drawImage(src,0,0,w,h);
  var id=ctx.getImageData(0,0,w,h);
  pixelFilter(id.data,'invert(1) hue-rotate(180deg)');
  ctx.putImageData(id,0,0);
}

function showDocPage(n){
  docCur=n;
  document.getElementById('doc-cur').textContent=n;
  var oc=docPages[n-1];
  var co=document.getElementById('doc-oc');
  co.width=oc.width;co.height=oc.height;
  co.getContext('2d').drawImage(oc,0,0);
  var cc=document.getElementById('doc-cc');
  cc.width=oc.width;cc.height=oc.height;
  var ctx=cc.getContext('2d');
  applyDocFilter(ctx,oc,oc.width,oc.height);
  document.getElementById('doc-prev').disabled=(n<=1);
  document.getElementById('doc-next').disabled=(n>=docPages.length);
}

function refreshDoc(){if(docPages.length)showDocPage(docCur);}
async function loadDoc(f){
  docBaseName=f.name||'converted';
  hideDrop();
}

// ── FUNZIONI DI CONVERTIMENTO VIDEO (PER DARK MODE)
var va = document.createElement('video');
va.preload='auto';cvid.playsInline=true;
document.body.appendChild(va);

function setSt(id, msg, err) {
  var el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  if (err) el.classList.add('error');
  else el.classList.remove('error');
}

function startRaf() {}
function hideDrop() {}

async function convertVideoFallback(btn){
  var srcW=va.videoWidth,srcH=va.videoHeight;
  if(!srcW||!srcH){setSt('vid','Dimensioni non disponibili.',true);btn.disabled=false;startRaf();return;}
  if(typeof MediaRecorder==='undefined'){setSt('vid','⚠️ Conversione non disponibile in questo browser.',true);btn.disabled=false;startRaf();return;}

  // Pausa il preview visibile: la conversione gira su un elemento dedicato
  try{va.pause();}catch(e){}

  // Mantieni la risoluzione originale (downscale solo se davvero enorme)
  var MAX_W=1920,scale=Math.min(1,MAX_W/srcW),w=Math.round(srcW*scale),h=Math.round(srcH*scale);
  var ec=document.createElement('canvas');ec.width=w;ec.height=h;
  var ex=ec.getContext('2d');
  if(!ec.captureStream && !ec.mozCaptureStream){setSt('vid','captureStream non supportato.',true);btn.disabled=false;startRaf();return;}

  // Funzione per applicare il filtro
  function applyFilter(ctx, cvid, w, h) {
    var flt='invert(1) hue-rotate(180deg)';
    try{
      ctx.drawImage(cvid,0,0,w,h);
      var id=ctx.getImageData(0,0,w,h);
      pixelFilter(id.data,'invert(1) hue-rotate(180deg)');
      ctx.putImageData(id,0,0);
    }catch(e){
      // Fallback per Safari (non supporta ctx.filter)
      try{
        ctx.drawImage(cvid,0,0,w,h);
        var id=ctx.getImageData(0,0,w,h);
        pixelFilter(id.data,'invert(1) hue-rotate(180deg)');
        ctx.putImageData(id,0,0);
      }catch(e2){}
    }
  }

  // Prima conversione (es. convertVideoFallback)
  applyFilter(ex, cvid, w, h);

  rec.start(250);
}

function pixelFilter(data, filter) {
  var out = new Float32Array(data.length);
  for(var i=0; i<data.length; i++) {
    if(i%4==3) continue;
    out[i] = data[i];
  }
  // Simulazione filtraggio con dati
  if(filter.includes('invert')) {
    for(let i=0; i<out.length; i++)
      if(i%4!==3) out[i]=255-out[i];
  }
  if(filter.includes('hue-rotate')) {
    const angle = parseInt(/hue-rotate\((.*)deg\)/.exec(filter)[1]);
    // Non usato per semplicità
  }

  for(let i=0; i<data.length; i++)
    if(i%4!==3) data[i] = out[i];
}

function rafLoop(){
  if(cvid.readyState>=2){
    var ctx=c.getContext('2d');
    try{ex.filter=flt;ex.drawImage(cvid,0,0,w,h);ex.filter='none';}catch(e){}
  }
}
</script>

<script>
// Altre funzioni per gestire l'interfaccia utente
function convertVideo() {
  var btn = document.querySelector('button');
  convertVideoFallback(btn);
}

window.addEventListener('load', function(){
  // Inizializzazione del codice...
});
</script>

</body>
</html>
