<!DOCTYPE html>
<html lang="it">
<head>
  <script>
(function(){
  if (!('serviceWorker' in navigator)) return;
  try {
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(r){
        try { r.unregister(); } catch(e){}
      });
    }).catch(function(){});
  } catch(e){}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dynamic Dark Converter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d0d0d;color:#e0e0e0;padding:1.5rem 1rem}
.app{width:100%;max-width:780px;margin:0 auto;background:#111;border-radius:14px;padding:1.5rem;border:1px solid #1e1e1e}
h1{font-size:22px;font-weight:700;color:#f0f0f0;margin-bottom:1.25rem}
.drop{border:1.5px dashed #2a2a2a;border-radius:10px;padding:1.5rem;text-align:center;cursor:pointer;background:#0d0d0d;transition:.15s;display:block}
.drop:hover,.drop.over{border-color:#fff;background:#161616}
.drop p{font-size:14px;color:#555;margin-top:10px}
.drop small{font-size:12px;color:#333;display:block;margin-top:4px}
input[type=file]{display:none}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
.card{border:1px solid #1e1e1e;border-radius:10px;overflow:hidden}
.clbl{font-size:10px;font-weight:700;color:#3a3a3a;padding:6px 10px;border-bottom:1px solid #1e1e1e;text-transform:uppercase;letter-spacing:.05em;background:#141414}
.cbody{padding:8px;background:#0d0d0d;display:flex;align-items:center;justify-content:center;min-height:80px}
.cbody img,.cbody canvas{max-width:100%;width:100%;max-height:220px;border-radius:3px;display:block;object-fit:contain}
.btn{display:block;width:100%;margin:8px auto 0;padding:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;border-radius:8px;background:#fff;color:#111;transition:opacity .15s}
.btn:disabled{opacity:.25;cursor:not-allowed}
.btn:not(:disabled):hover{opacity:.85}
.btn-rm{display:block;width:100%;margin:6px auto 0;padding:8px;font-size:12px;cursor:pointer;border:1px solid #2a2a2a;border-radius:8px;background:transparent;color:#555;transition:all .15s}
.btn-rm:hover{border-color:#f87171;color:#f87171}
.btn-dl{display:block;width:100%;margin:6px auto 0;padding:8px;font-size:13px;cursor:pointer;border:1px solid #2a2a2a;border-radius:8px;background:transparent;color:#888;transition:background .15s}
.btn-dl:hover{background:#1a1a1a}
.st{font-size:12px;color:#444;padding:4px 0;min-height:22px;text-align:center}
.st.err{color:#f87171}
.bar{height:3px;background:#1a1a1a;border-radius:2px;overflow:hidden;margin:2px 0}
.fill{height:100%;background:#fff;border-radius:2px;transition:width .25s;width:0}
.ai-banner{display:none;margin-top:10px;padding:10px 14px;background:#101a12;border:1px solid #1a2e1c;border-radius:8px;font-size:12px;line-height:1.6}
.ai-top{display:-webkit-box;display:-ms-flexbox;display:flex;-webkit-box-align:center;-ms-flex-align:center;align-items:center;gap:8px;margin-bottom:5px;-ms-flex-wrap:wrap;flex-wrap:wrap}
.ai-badge{font-size:10px;font-weight:700;padding:2px 7px;background:#14532d;color:#4ade80;border-radius:20px;letter-spacing:.04em}
.ai-filterlbl{font-size:12px;color:#4ade80;font-weight:700}
.ai-css{font-size:11px;color:#1f5c35;font-family:monospace}
.ai-reason{color:#4a6a50;font-size:12px}
.docnav{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:#111;border:1px solid #1e1e1e;border-bottom:none;border-radius:10px 10px 0 0;margin-top:10px}
.docpages{border:1px solid #1e1e1e;border-radius:0 0 10px 10px;display:grid;grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr)}
.docpg{padding:8px;display:flex;flex-direction:column;gap:5px;background:#0d0d0d}
.docpg canvas{max-width:100%;border-radius:3px}
.docpdlbl{font-size:10px;font-weight:700;color:#3a3a3a;text-transform:uppercase;letter-spacing:.05em}
.docdiv{background:#1e1e1e}
.navbtn{padding:3px 12px;font-size:12px;border:1px solid #2a2a2a;border-radius:5px;background:#1a1a1a;color:#888;cursor:pointer}
.navbtn:disabled{opacity:.3;cursor:not-allowed}
.navbtn:not(:disabled):hover{background:#222;color:#ccc}
.vidwrap{margin-top:10px;border:1px solid #1e1e1e;border-radius:10px;overflow:hidden}
.vidcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.vidcol{display:flex;flex-direction:column}
.vidcol+.vidcol{border-left:1px solid #1e1e1e}
.vidclbl{font-size:10px;font-weight:700;color:#3a3a3a;text-transform:uppercase;letter-spacing:.05em;padding:6px 10px;border-bottom:1px solid #1e1e1e;background:#111}
.vidbody{background:#000;min-height:100px;display:flex;align-items:center;justify-content:center}
.vidbody video,.vidbody canvas{max-width:100%;max-height:220px;width:auto;height:auto;display:block;margin:0 auto}
.vidctrls{padding:8px 12px;background:#111;border-top:1px solid #1e1e1e}
.tlrow{display:-webkit-box;display:-ms-flexbox;display:flex;-webkit-box-align:center;-ms-flex-align:center;align-items:center;gap:8px}
.tl{flex:1;height:8px;background:#2a2a2a;border-radius:4px;cursor:pointer;overflow:hidden}
.tlfill{height:100%;background:#fff;width:0%}
.tltime{font-size:11px;color:#444;min-width:75px;text-align:right}
.cbtn{padding:4px 12px;font-size:12px;border:1px solid #fff;border-radius:5px;background:#fff;color:#111;cursor:pointer}
.cbtn.play{background:#fff;color:#111}
.spin{display:inline-block;width:11px;height:11px;border:1.5px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:560px){.split,.vidcols,.docpages{grid-template-columns:1fr}.docdiv{display:none}}
</style>
</head>

<script>
'use strict';

/* ─── polyfills ─── */
if(!String.prototype.startsWith){String.prototype.startsWith=function(s){return this.indexOf(s)===0;};}
if(!String.prototype.includes){String.prototype.includes=function(s){return this.indexOf(s)!==-1;};}
if(!Array.prototype.find){Array.prototype.find=function(fn){for(var i=0;i<this.length;i++){if(fn(this[i],i,this))return this[i];}return undefined;};}

/* ─── cross-browser ctx.filter detection ─── */
var ctxFilterOK=(function(){
  try{var s=document.createElement('canvas');s.width=s.height=2;var sc=s.getContext('2d');sc.fillStyle='#fff';sc.fillRect(0,0,2,2);
  var d=document.createElement('canvas');d.width=d.height=2;var dc=d.getContext('2d');dc.filter='invert(1)';dc.drawImage(s,0,0);dc.filter='none';
  return dc.getImageData(0,0,1,1).data[0]<50;}catch(e){return false;}}
)();

/* ─── pixel fallback ─── */
function pixelFilter(data,filterStr){
  if(!filterStr||filterStr==='none')return;
  var re=/([\w-]+)\(([^)]*)\)/g,m;
  while((m=re.exec(filterStr))!==null){
    var fn=m[1],val=parseFloat(m[2]),n=data.length,i;
    if(fn==='invert'){for(i=0;i<n;i+=4){data[i]=255-data[i];data[i+1]=255-data[i+1];data[i+2]=255-data[i+2];}}
    else if(fn==='brightness'){for(i=0;i<n;i+=4){data[i]=Math.min(255,data[i]*val);data[i+1]=Math.min(255,data[i+1]*val);data[i+2]=Math.min(255,data[i+2]*val);}}
    else if(fn==='saturate'){for(i=0;i<n;i+=4){var r=data[i]/255,g=data[i+1]/255,b=data[i+2]/255,l=0.2126*r+0.7152*g+0.0722*b;data[i]=Math.round(Math.min(255,Math.max(0,(l+(r-l)*val)*255)));data[i+1]=Math.round(Math.min(255,Math.max(0,(l+(g-l)*val)*255)));data[i+2]=Math.round(Math.min(255,Math.max(0,(l+(b-l)*val)*255)));}}
    else if(fn==='sepia'){for(i=0;i<n;i+=4){var r=data[i],g=data[i+1],b=data[i+2],sr=Math.min(255,r*.393+g*.769+b*.189),sg=Math.min(255,r*.349+g*.686+b*.168),sb=Math.min(255,r*.272+g*.534+b*.131);data[i]=Math.round(r*(1-val)+sr*val);data[i+1]=Math.round(g*(1-val)+sg*val);data[i+2]=Math.round(b*(1-val)+sb*val);}}

function hslToRgb(h,s,l){

  if(h<60){r=c;g=x;b=0;}else if(h<120){r=x;g=c;b=0;}else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;}else if(h<300){r=x;g=0;b=c;}else{r=c;g=0;b=x;}
  return[Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}
function smartInvertPixels(data){
  // Inverts luminance only — achromatic stays gray-scale, colored keeps its hue
  // Red stays red, blue stays blue — no more red→cyan artifacts
  for(var i=0;i<data.length;i+=4){
    var r=data[i]/255,g=data[i+1]/255,b=data[i+2]/255;
    var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;
    var s=mx===mn?0:(l<0.5?(mx-mn)/(mx+mn):(mx-mn)/(2-mx-mn));
    if(s<0.12){
      var v=Math.round((1-l)*255);data[i]=v;data[i+1]=v;data[i+2]=v;
    }else{
      var h;
      if(mx===r)h=(g-b)/(mx-mn);else if(mx===g)h=2+(b-r)/(mx-mn);else h=4+(r-g)/(mx-mn);
      h=((h*60)%360+360)%360;
      var rgb=hslToRgb(h,s,1-l);
      data[i]=rgb[0];data[i+1]=rgb[1];data[i+2]=rgb[2];
    }
  }
}

function isPhotoBlock(imgData){
  // A photo block has: significant mid-luminance pixels AND color variance (saturation)
  var d=imgData.data,n=imgData.width*imgData.height;
  var mid=0,satSum=0,nearWhite=0;
  for(var i=0;i<d.length;i+=4){
    var r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255;
    var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;

function applyMixed(ctx,src,w,h){

    if(s<0.08&&l>0.07&&l<0.93){

function analyze(canvas,tabId){

  for(var row=0;row<ROWS;row++){for(var col=0;col<COLS;col++){var x0=col*cellW,y0=row*cellH,cW=Math.min(cellW,W-x0),cH=Math.min(cellH,H-y0);if(cW<4||cH<4)continue;var cWh=0,cMid=0,cSat=0,cSh=0,cT=cW*cH;for(var cy=y0;cy<y0+cH;cy++){for(var cx=x0;cx<x0+cW;cx++){var idx=cy*W+cx,cl=lum[idx],cr=px[idx*4]/255,cg=px[idx*4+1]/255,cb=px[idx*4+2]/255,cmx=Math.max(cr,cg,cb),cmn=Math.min(cr,cg,cb),cs=cmx===cmn?0:(cl<0.5?(cmx-cmn)/(cmx+cmn):(cmx-cmn)/(2-cmx-cmn));if(cl>0.85)cWh++;if(cl>0.12&&cl<0.82)cMid++;cSat+=cs;if(cx<x0+cW-1){var de=Math.abs(cl-lum[cy*W+cx+1]);if(de>0.28)cSh++;}}}var cWR=cWh/cT,cMR=cMid/cT,cAvS=cSat/cT,cShR=cSh/((cW-1)*cH||1),cST=cWR*2+cShR*2+Math.max(0,0.10-cAvS)*10,cSP=cMR*2.5+Math.min(1,cAvS/0.12)*2+(1-cShR);if(cWR>0.92)continue;if(cST>1.8&&cST>cSP*1.3)textC++;else if(cSP>1.5&&cSP>cST)photoC++;}}

  if(tabId==='vid'){var digSig=(sharpR>0.25&&whiteR>0.10)||(sharpR>0.35)||(avgS>0.30&&sharpR>0.20),anaS=mid>0.35&&sharpR<0.25;isDigital=digSig&&!anaS;}

function loadImg(f){
  imgBaseName=f.name||'converted';
  setSt('img',sp('Caricamento...'));
  var r=new FileReader();
  r.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      imgEl=img;
      hideDrop();
      document.getElementById('img-orig').src=ev.target.result;
      document.getElementById('img-wrap').style.display='block';
      refreshImg();
      setSt('img',f.name+' · '+img.naturalWidth+'×'+img.naturalHeight+'px');
      var tc=document.createElement('canvas');tc.width=img.naturalWidth;tc.height=img.naturalHeight;tc.getContext('2d').drawImage(img,0,0);
      analyze(tc,'img');

    img.src=ev.target.result;

function convImg(){
  if(!imgEl)return;
  var btn=document.getElementById('img-btn');
  btn.disabled=true;btn.textContent='Conversione...';
  setTimeout(function(){
    // Cap at 2400px on longest side to avoid huge files
    var MAX=1920,sw=imgEl.naturalWidth,sh=imgEl.naturalHeight;
    var scale=Math.min(1,MAX/Math.max(sw,sh));
    var w=Math.round(sw*scale),h=Math.round(sh*scale);
    var exp=document.getElementById('img-exp');
    exp.width=w;exp.height=h;
    var ctx=exp.getContext('2d');
    // draw scaled
    var tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;
    tmp.getContext('2d').drawImage(imgEl,0,0,w,h);
    if(contentMixed)applyMixed(ctx,tmp,w,h);else applyFilter(ctx,tmp,w,h);
    // use JPEG 0.88 — much smaller than PNG, visually indistinguishable
    var url=exp.toDataURL('image/jpeg',0.75);
    var a=document.createElement('a');
    a.href=url;a.download=darkName(imgBaseName,'jpg');
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    var kb=Math.round(url.length*0.75/1024);
    var sizeStr=kb>1024?(kb/1024).toFixed(1)+' MB':kb+' KB';
    setBar('img',100);setSt('img','✓ Download avviato — '+sizeStr);
    btn.disabled=false;btn.textContent='Converti e scarica JPG';
  },50);
}
function clearImg(){imgEl=null;F=FILTERS.night;contentMixed=false;document.getElementById('img-wrap').style.display='none';document.getElementById('img-ai').style.display='none';document.getElementById('img-st').textContent='';document.getElementById('img-fill').style.width='0';showDrop();}

// Applica invert+hue-rotate con fallback pixel per Safari
function applyDocFilter(ctx, src, w, h){
  // Usa sempre il metodo pixel — garantito su tutti i browser incluso WebKit/Unite Pro

  ctx.drawImage(src,0,0,w,h);

}
function showDocPage(n){

async function loadDoc(f){

async function getFFmpeg(){
  if(_ffmpegInst)return _ffmpegInst;

  // ffmpeg.wasm v0.11 + core-st (single-thread) gira SENZA SharedArrayBuffer/COOP/COEP.
  // Compatibile con GitHub Pages, Safari e qualunque origine HTTPS senza service worker.
  // Fallback su MediaRecorder solo se la fetch del bundle fallisce davvero (es. offline).

  if(window.location.protocol==='file:'){
    throw new Error('file:// — usa MediaRecorder');
  }

  setSt('vid',sp('Caricamento ffmpeg (~30 MB, solo la prima volta)...'));

  // Load ffmpeg v0.11 UMD bundle from CDN (self-registering, no webpack publicPath issue)
  if(typeof window.FFmpeg === 'undefined'){
    try{
      await loadJS('https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js');
    }catch(e){
      throw new Error('Errore caricamento ffmpeg.js: '+(e&&e.message||e));
    }
  }
  if(typeof window.FFmpeg==='undefined'||typeof window.FFmpeg.createFFmpeg==='undefined'){
    throw new Error('ffmpeg.js v0.11 non caricato');

  var ff=window.FFmpeg.createFFmpeg({

    if(cvid.ended||(dur&&cvid.currentTime>=dur-0.1)){stopRec();return;}

    setBar('vid',Math.round((cvid.currentTime/dur)*100));
  }
  if(typeof cvid.requestVideoFrameCallback==='function'){
    (function onVFrame(){
      if(recStopped)return;
      drawFrame();
      if(!recStopped) cvid.requestVideoFrameCallback(onVFrame);
    })();
  }
  // Backup interval — VFC smette di sparare a fine stream
  frameIv=setInterval(function(){
    if(recStopped)return;
    if(cvid.ended||(dur&&cvid.currentTime>=dur-0.1)){stopRec();return;}
    if(typeof cvid.requestVideoFrameCallback!=='function') drawFrame();
  },200);

  // Watchdog: se currentTime non avanza per ~10s nonostante l'auto-resume, esci
  var lastT=-1,stallCount=0;
  watchdog=setInterval(function(){
    if(recStopped)return;
    var ct=cvid.currentTime;
    if(ct<=lastT+0.05) stallCount++; else stallCount=0;
    lastT=ct;
    // Se stalla e il video è in pausa, riprova a riprodurlo
    if(stallCount>=4 && cvid.paused && !cvid.ended){
      console.warn('[DDC] stall+paused, retry play');
      cvid.play().catch(function(){});
    }
    if(stallCount>=20){console.warn('[DDC] Stall detected, stopping');stopRec();}
  },500);
}
